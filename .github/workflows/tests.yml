name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  citation-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install disposable PostgreSQL engine
        run: npm install --prefix backend/data/citation-validation --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.5.14
      - name: Verify citation migration and transactions
        run: node backend/tests/run_citation_sql.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-key
      OPENAI_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: uv sync --group dev
      - name: Run backend tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install frontend deps
        run: npm ci
      - name: Run frontend tests
        run: npm run test:run
      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep this version aligned with @playwright/test in frontend/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install frontend deps
        timeout-minutes: 5
        run: npm ci
      - name: Verify Playwright image version
        run: node -e "if (require('@playwright/test/package.json').version !== '1.58.2') throw new Error('Update the CI Playwright image to match package-lock.json')"
      - name: Run E2E smoke tests
        timeout-minutes: 8
        run: npm run test:e2e
